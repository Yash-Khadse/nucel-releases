name: Bug report
description: Something in the Android app is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not include account details, tokens or screenshots of your saved content.
  - type: input
    id: version
    attributes:
      label: App version
      description: The APK you installed, for example v1.10.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Pixel 8, Android 15
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Tap ..."
